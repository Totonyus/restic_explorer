<head>
    <script src="commons.js"></script>
    <script src="core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Restic explorer - Diff</title>
    <link rel="icon" href="favicon.png" type="image/x-icon"/>
</head>

<div>
    <h2 id="repository_title"></h2>
    <h3 id="snapshot_details"></h3>

    <div><input class='command_line_input' id='command_line_input' type='text' value=''
                onfocus='(()=>{event.target.select()})()'/></div>

    <div class='top_buttons_header'>
        <div>
            Sort by :
            <select class="button" id="sorting_method" onchange="change_sort_method()">
                <option selected value="added_size">Added size</option>
                <option value="removed_size">Removed size</option>
                <option value="diff_size">Diff size</option>
                <option value="name">Name</option>
            </select>

            <span class="reverse_sorting_button button"
                  onclick="(()=>{event.target.firstChild.checked = !event.target.firstChild.checked; change_sort_method()})(); event.target.classList.toggle('active')"><input
                    type="checkbox" id="reverse_sorting" value="Reverse"> Reverse sorting</span>
        </div>

        <div>
        </div>
    </div>

    <div class='top_buttons_header'>
        <span style="width: 5%">
        Go to
        </span>
        <span style="width: 90%">
            <input id='goto_input' style="width: 100%" type="text">
        </span>
        <span style="width: 5%; text-align: center">
        <a class="action_button button" onclick="goto_button_click(event)"> > </a>
        </span>
    </div>

    <div class='table_header'>
        <span class="attribute_header attribute include">Added</span>
        <span class="attribute_header attribute exclude">Removed</span>
        <span class="attribute_header attribute">Diff</span>
    </div>

    <div id="content">
        <div id="loading_animation">
            <div class="lds-ellipsis">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);

    const query_repo = urlParams.get('repo')
    const query_snapshot1 = urlParams.get('snapshot1')
    const query_snapshot2 = urlParams.get('snapshot2')
    const query_force_refresh = urlParams.get('force_refresh')

    // const init_dom_informations = function () {
    //     document.getElementById('repository_title').innerHTML = query_repository;
    //     document.getElementById('archive_title').innerHTML = ` ${query_archive1} <> ${query_archive2}`;
    //     document.getElementById('command_line_input').value = `borg diff ${query_repository}::${query_archive1} ${query_archive2}`;
    // }

    // init_dom_informations();

    const get_html_template = function (index, level) {
        const level_data = level['/info'];
        const level_path = level['/info']['path'];
        const level_icon = get_level_icon(level)

        let added = level_data.total_added_size;
        let removed = level_data.total_removed_size;

        const is_level_file = is_file(level);

        if (is_level_file){
            added = level_data.size
            removed = level_data.old_size
        }

        return `
        <div class='level_container'>
        <div class='header' id="${level_path}">

        <span class="index_content">
        ${level_icon !== null ? `<div class='expand'><img src="${level_icon}"/></div>` : `<div class='expand'> </div>`}
        <div>${index}</div>
        </span>

        <span class='size'>

        <span class="attribute include">${file_size(added)} </span>
        <span class="attribute exclude">${file_size(removed)} </span>
        <span class="attribute ">${add_heading_sign(added - removed)}${file_size(added - removed)} </span>

        </span>
        </div>

        <hr class='sec_sep'>

        <div class='nested_level'></div>
        </div>`
    }

    init_core({
        repository: query_repo,
        archive1: query_snapshot1,
        archive2: query_snapshot2,
        api_url: (() => {
            if (query_force_refresh === 'true') {
                return `repo/${query_repo}/diff?snapshot1=${query_snapshot1}&snapshot2=${query_snapshot2}&force_refresh=${query_force_refresh}`
            }
            return `repo/${query_repo}/diff?snapshot1=${query_snapshot1}&snapshot2=${query_snapshot2}`
        })(),
        template_method: get_html_template,
        get_data: (level) => {
            return level['/info']
        },
        get_path: (level) => {
            return level["/info"]['path']
        },
        report_type: "diff"
    })

    init_request();

</script>
